name: wedge
on:
  workflow_dispatch:
    inputs:
      tag: { required: true }
      label: { default: 'ubuntu-latest' }
      sleep: { default: '5' }
concurrency:
  group: wedge
  cancel-in-progress: false
  queue: max
run-name: wedge ${{ inputs.tag }}
jobs:
  hold:
    runs-on: ${{ inputs.label }}
    timeout-minutes: 1
    steps:
      - run: echo "start $(date -u +%FT%TZ)"; sleep ${{ inputs.sleep }}
